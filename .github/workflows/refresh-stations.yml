name: Refresh station urls and logos

# Broadcasters move their streams and change their logos without notice. Once a week this probes every station,
# finds a verified current url for the broken ones (scripts/Update-StationUrls.ps1) and a logo for the stations
# without one (scripts/Update-StationLogos.ps1), checks the list (scripts/ci/Invoke-Tests.ps1), then
# scripts/Publish-Refresh.ps1 writes the release note docs/releases/<date>-refresh.md, opens a pull request with it
# and merges it, so GitHub Pages serves the fixed list and logos to every RoRadio install within minutes, and keeps
# the issue "Stations the weekly refresh could not fix" current. The whole flow runs end to end against a fake
# station server in tests/Refresh.E2E.Tests.ps1.
on:
  workflow_dispatch:
    inputs:
      merge:
        description: Merge the pull request when the fix is small enough
        type: boolean
        default: true
      dry_run:
        description: Dry run against the live station list (report only; no commit, pull request or issue)
        type: boolean
        default: false
  schedule:
    - cron: '17 4 * * 1'  # Mondays 04:17 UTC

permissions:
  contents: read

concurrency:
  group: refresh-stations
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write       # push the refresh branch and merge it
      pull-requests: write  # open and merge the pull request
      issues: write         # keep the issue of the stations it could not fix current
      pages: write          # request a Pages build after the merge
      actions: write        # re-enable this workflow so GitHub does not disable it after 60 quiet days
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'

      - name: Install the Python tools and Pester (pinned)
        shell: pwsh
        run: |
          python -m pip install --quiet -r scripts/ci/requirements.txt
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Probe the stations and fix the broken urls
        id: urls
        shell: pwsh
        # Only outright dead streams: from a US runner an HTTP error can be geo-blocking (see the script's help).
        run: |
          $dryRun = $env:DRY_RUN -eq 'true'
          $results = ./scripts/Update-StationUrls.ps1 -ReplaceOnlyDead -ReportPath "$env:RUNNER_TEMP/urls.md" -WhatIf:$dryRun
          "count=$(@($results | Where-Object NewUrl).Count)" >> $env:GITHUB_OUTPUT

      - name: Find logos for the stations without one
        id: logos
        # Released apps older than the Pages logo fallback (RoRadio 2.0.1, 1.6.x) look for a logo only in their own
        # package and show an empty tile for one they do not bundle, so this step waits for the repository variable
        # REFRESH_LOGOS, set to 'true' once the releases that load such logos from Pages are out (README).
        if: vars.REFRESH_LOGOS == 'true'
        shell: pwsh
        run: |
          $dryRun = $env:DRY_RUN -eq 'true'
          $results = ./scripts/Update-StationLogos.ps1 -Python python -ReportPath "$env:RUNNER_TEMP/logos.md" -WhatIf:$dryRun
          "count=$(@($results | Where-Object File).Count)" >> $env:GITHUB_OUTPUT

      - name: Dry run report
        if: env.DRY_RUN == 'true'
        shell: pwsh
        run: |
          Get-Content "$env:RUNNER_TEMP/urls.md" | Add-Content $env:GITHUB_STEP_SUMMARY
          if (Test-Path "$env:RUNNER_TEMP/logos.md") { Get-Content "$env:RUNNER_TEMP/logos.md" | Add-Content $env:GITHUB_STEP_SUMMARY }

      - name: Check the list before committing (a pull request opened by this workflow starts no CI)
        if: env.DRY_RUN != 'true'
        shell: pwsh
        run: ./scripts/ci/Invoke-Tests.ps1 -Python python

      - name: Write the release note, open and merge the pull request, update the issue
        if: env.DRY_RUN != 'true'
        shell: pwsh
        env:
          URLS: ${{ steps.urls.outputs.count }}
          LOGOS: ${{ steps.logos.outputs.count || '0' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MERGE: ${{ github.event_name == 'schedule' || inputs.merge }}
        run: |
          ./scripts/Publish-Refresh.ps1 -UrlReport "$env:RUNNER_TEMP/urls.md" -LogoReport "$env:RUNNER_TEMP/logos.md" `
            -UrlCount $env:URLS -LogoCount $env:LOGOS -Merge:($env:MERGE -eq 'true') -RunUrl $env:RUN_URL

      - name: Keep the schedule alive
        if: always()
        shell: bash
        run: gh api -X PUT "repos/$GH_REPO/actions/workflows/refresh-stations.yml/enable" --silent
