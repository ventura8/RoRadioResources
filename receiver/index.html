<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--
        Content Security Policy: scripts only from the Cast framework on www.gstatic.com (and the Shaka player it loads,
        protocol-relative, from ajax.googleapis.com: https on a device, as the page is https) and the page's own
        receiver.js ('self'); no inline script, no eval, no plugins, no forms, no base. Pictures and streams are the
        station's own, on any http(s) host.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://www.gstatic.com ajax.googleapis.com; style-src 'unsafe-inline' https://www.gstatic.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com https://www.gstatic.com data:; img-src https: http: data: blob:; media-src https: http: data: blob:; connect-src https: http: wss: ws://localhost:8008; worker-src blob: https://www.gstatic.com; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>RoRadio</title>
    <!--
        The RoRadio Cast receiver (2.4.5). A Chromecast, a TV or a smart display loads this page when the app casts a
        station: Google's media player plays the stream, and this page shows the song - cover, title, artist, album,
        year - and the live captions, each on its own line. The app sends a song change as a QUEUE_UPDATE of the item
        playing (Google's own receiver ignores those); the interceptor below applies it here, and to the senders'
        notifications through setMediaInformation. The item's customData is JSON text, {"caption", "previous",
        "next"} (a bare string from older app builds is the caption alone).
        Previous / next (2.4.5): while the station has others in its group the page declares QUEUE_PREV / QUEUE_NEXT,
        so a smart display, Google TV and the Google Home app show those buttons (none when the station is alone in its
        group, as in the app). A press is not played here: the page broadcasts a media status whose customData is
        {"step": "previous"|"next", "stepId": n}, and the app steps through the group exactly as its own buttons do,
        then loads the new station here.
        Touch displays (2.4.5): the page plays through its own audio element and declares uiConfig.touchScreenOptimizedApp,
        so a Pixel Tablet or a Nest Hub shows this page, not Google's default audio UI. The device still draws its
        system media bar (previous / pause / next) over the bottom; the page keeps above it and has no buttons of its own.
        The cover fills the safe area's height on the left (the station's logo takes its place when the song has no
        cover), the station's logo heads the song's column, and the text is sized for a room away from the TV.
        Layout rules (Cast design guidelines): everything inside a 5 % safe area, text at least 24 px at 720p, white on
        a dark scrim over the blurred cover, a fixed grid so no element can grow into another, long text clamped with an
        ellipsis. Audio-only devices draw nothing and play the audio.
    -->
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
        :root {
            color-scheme: dark;

            --safe-x: 5vw;
            --safe-y: 5vh;
            --gap: clamp(16px, 3.5vmin, 48px);
            --text: #fff;
            --muted: rgb(255 255 255 / 78%);
            --scrim: rgb(8 10 14 / 72%);
            --accent: #ff6a3d;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #08090c;
            color: var(--text);
            font-family: "Google Sans", Roboto, "Segoe UI", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /*
         * The page's own audio element plays the stream (player.setMediaElement): with Google's cast-media-player, a
         * touch display (Pixel Tablet, Nest Hub) drew its default audio UI over this page.
         */
        #media {
            display: none;
        }

        /*
         * The whole screen behind the song: its cover (the station's logo when it has none), very blurred, under a dark
         * scrim that keeps the white text readable (WCAG AA, measured on the real pixels). A new song or station
         * crossfades into the last one.
         */
        #backdrop {
            position: fixed;
            inset: -15%;
            background-position: center;
            background-size: cover;
            filter: blur(14vmin) saturate(1.4);
            transform: scale(1.2);
            opacity: 0;
            transition: opacity 800ms ease, background-image 800ms ease;
        }

        #backdrop.shown {
            opacity: 1;
        }

        #scrim {
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, var(--scrim), rgb(8 10 14 / 88%));
            transition: background-color 800ms ease;
        }

        /*
         * The app's cover colour theme (opt-in in the app): the scrim takes the app's tint, the colour white text reads
         * on (AppColorHelper.ReadableTint), and the accent colours the page's highlights. Off: the default look.
         */
        body.themed #scrim {
            background: linear-gradient(180deg, rgb(from var(--theme-tint) r g b / 80%), rgb(from var(--theme-tint) r g b / 92%));
        }

        main {
            position: fixed;
            inset: var(--safe-y) var(--safe-x);
            display: grid;
            grid-template:
                "cover song" minmax(0, 1fr)
                "captions captions" auto
                / minmax(0, auto) minmax(0, 1fr);
            gap: var(--gap);

            /* The cover and the song from the same top: the station's logo level with the cover's top edge. */
            align-items: start;
        }

        /* No caption band: no gap for it either, or a full-height cover ran past the safe area (2560 x 1080). */
        body:not(.captioned) main {
            row-gap: 0;
        }

        /*
         * The cover is the screen's picture: the safe area's whole height beside the song, less the captions' band while
         * one shows (body.captioned), and never more than half the width, so the song keeps its column.
         */
        body {
            --cover: min(90vh, 48vw);
        }

        /* 90 % less a two-line caption band (2 x 6 vmin + padding) and the gap: the cover never reaches it. */
        body.captioned {
            --cover: min(70vh, 48vw);
        }

        #cover {
            grid-area: cover;
            width: var(--cover);
            aspect-ratio: 1;
            border-radius: clamp(12px, 2vmin, 28px);
            object-fit: cover;

            /*
             * The picture sits directly on the page: no background, plate, card or shadow behind the cover or the
             * logo (owner, 2026-11-14). No animation of its size: shrinking as a caption band appeared, it covered
             * the band for 300 ms.
             */
            background: none;
            box-shadow: none;
        }

        /* No cover for the song: the station's own logo in its place, whole, as it is drawn. */
        #cover.logo {
            object-fit: contain;
            border-radius: 0;
        }

        /*
         * Filled from the top, as tall as its text needs up to the whole row: on a 4:3 or near-square screen the cover
         * (half the width) is shorter than the logo and a two-line title, and the song goes on below its bottom edge.
         */
        #song {
            grid-area: song;
            min-width: 0;
            max-height: 100%;
            overflow: hidden;
            display: grid;

            /*
             * A fixed layout, the same with and without a cover (owner, 2026-11-14): the song's text from the top of
             * the cover, the station's logo and name at the column's bottom, level with the cover's bottom edge. The
             * column is the cover's height, so nothing moves between a song and the station alone.
             */
            height: var(--cover);
            grid-template-rows: auto auto auto minmax(0, 1fr) auto;
            align-content: start;
            row-gap: clamp(8px, 1.6vmin, 22px);
        }

        #song > * {
            margin: 0;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #title {
            font-size: clamp(32px, 11vmin, 160px);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.01em;
        }

        /*
         * The title, the artist and the album take up to two lines each. receiver.js shrinks a text that needs more
         * in steps, down to 24 px at 1080p, before the second line ends in an ellipsis.
         */
        #title,
        #artist,
        #release {
            white-space: normal;
            overflow-wrap: anywhere;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
        }

        #artist {
            font-size: clamp(26px, 7vmin, 100px);
            font-weight: 500;
            line-height: 1.2;
        }

        /* The album and its year on one line: "Deliria · 2015". */
        #release {
            font-size: clamp(24px, 5.5vmin, 80px);
            color: var(--muted);
            line-height: 1.25;
        }

        #album:not(:empty) + #year:not(:empty)::before {
            content: " \00b7  ";
        }

        #station {
            display: flex;
            grid-row: 5;
            align-self: end;
            align-items: center;
            min-width: 0;
        }

        #station img {
            /* As big as the column takes with a two-line title and a two-line caption (owner: the station's icon big too). */
            width: clamp(72px, 22vmin, 300px);
            height: clamp(72px, 22vmin, 300px);
            flex: none;
            object-fit: contain;

            /* Beside a cover the logo looks as it does in the cover's place: transparent, no plate or shadow. */
            background: none;
        }

        /*
         * A dark logo (dark lettering on transparency, measured by receiver.js) on the dark screen: a white glow
         * around its own shapes makes it readable, with no plate or tile behind it.
         */
        #station img.light,
        #cover.light {
            filter: drop-shadow(0 0 0.3vmin rgb(255 255 255 / 95%)) drop-shadow(0 0 1.2vmin rgb(255 255 255 / 70%));
        }

        /* The station's name beside its logo: never a placeholder, nothing when the app sends none. */
        #stationName {
            min-width: 0;
            margin-left: clamp(10px, 2vmin, 28px);
            overflow: hidden;
            color: var(--muted);
            font-size: clamp(22px, 4vmin, 56px);
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #station img:not([src]) {
            display: none;
        }

        #captions {
            grid-area: captions;
            justify-self: center;
            max-width: 100%;
            margin: 0;
            padding: clamp(10px, 1.6vmin, 22px) clamp(18px, 3vmin, 42px);
            border-radius: clamp(10px, 1.6vmin, 20px);
            background: rgb(0 0 0 / 70%);
            font-size: clamp(26px, 4.6vmin, 64px);
            line-height: 1.3;
            text-align: center;
        }

        /* Clamped inside the band: the band's padding never shows a cut third line. */
        #captionText {
            overflow: hidden;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
        }

        #captions.empty,
        /* By class, set by show(): a selector a receiver's browser does not know (:has) would drop the whole rule. */
        #release.empty,
        #station.empty {
            display: none;
        }

        /* Before a station is cast, and between plays. */
        #idle {
            position: fixed;
            inset: 0;
            display: grid;
            place-content: center;
            justify-items: center;
            text-align: center;
            row-gap: 2.4vmin;
            background: radial-gradient(circle at 50% 42%, rgb(255 106 61 / 18%), transparent 55%), #08090c;
        }

        /* The app's own icon on a soft tile (1920 x 1080: 216 px; 2560 x 1600: 320 px). */
        #appIcon {
            width: clamp(120px, 20vmin, 320px);
            height: clamp(120px, 20vmin, 320px);
            padding: clamp(16px, 2.6vmin, 40px);
            box-sizing: border-box;
            border-radius: 22%;
            background: rgb(255 255 255 / 8%);
            box-shadow: 0 2vmin 6vmin rgb(0 0 0 / 50%);
            object-fit: contain;
        }

        /* The last station's stream failed: the status says so, in the accent colour. */
        body.failed #status {
            max-width: 70vw;
            color: var(--accent);
        }

        #idle #hint {
            /* 24 px at 1080p and in proportion above it (10-foot UI): 2.4 % of the height. */
            font-size: max(2.4vh, 16px);
            color: rgb(255 255 255 / 60%);
        }

        /*
         * A touch display (Pixel Tablet) draws its system media bar over the bottom of the page: progress, LIVE, the
         * output chip, previous / pause / next, from 73 % of the height down (2560 x 1600, 2026-11-14). The page keeps
         * out of that band: the song, the cover and the captions end above it, nothing is drawn under the bar.
         */
        body.touch {
            --system-bar: 30vh;
            --cover: min(64vh, 48vw);
        }

        body.touch.captioned {
            --cover: min(44vh, 48vw);
        }

        body.touch main,
        body.touch #idle {
            bottom: var(--system-bar);
        }

        /* Less height above the bar: the logo and the song's text a size smaller, so a long song still fits. */
        body.touch #station img {
            width: clamp(56px, 14vmin, 240px);
            height: clamp(56px, 14vmin, 240px);
        }

        body.touch #title {
            font-size: clamp(32px, 7vmin, 120px);
        }

        body.touch #artist {
            font-size: clamp(26px, 5vmin, 84px);
        }

        body.touch #release {
            font-size: clamp(24px, 4vmin, 64px);
        }

        #idle h1 {
            margin: 0;
            font-size: clamp(40px, 9vmin, 120px);
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        #idle h1 span {
            color: var(--accent);
        }

        #idle p {
            margin: 0;
            font-size: clamp(24px, 3.4vmin, 44px);
            color: var(--muted);
        }

        body.playing #idle,
        body:not(.playing) main {
            display: none;
        }

        /* A tall screen (a display turned upright): the cover above the song. */
        @media (aspect-ratio < 1) {
            /* Upright, the song is under the cover: its column is as tall as its text. */
            #song {
                height: auto;
            }

            main {
                grid-template:
                    "cover" auto
                    "song" minmax(0, 1fr)
                    "captions" auto
                    / minmax(0, 1fr);
                justify-items: center;
                text-align: center;
            }

            /* The cover, the logo, a two-line title and a two-line caption, stacked within the height (800 x 1280). */
            body,
            body.captioned {
                --cover: min(84vw, 36vh);
            }

            /* Upright on a touch display: the same, above the system media bar. */
            body.touch,
            body.touch.captioned {
                --cover: min(84vw, 24vh);
            }

            #station img {
                width: clamp(56px, 12vmin, 160px);
                height: clamp(56px, 12vmin, 160px);
            }

            #station {
                justify-content: center;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #backdrop {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <audio id="media"></audio>
    <div id="backdrop" aria-hidden="true"></div>
    <div id="scrim" aria-hidden="true"></div>
    <section id="idle" aria-label="RoRadio">
        <img id="appIcon" src="icon.png" alt="">
        <h1>Ro<span>Radio</span></h1>
        <p id="status">Ready to play</p>
        <p id="hint">Romanian radio, live</p>
    </section>
    <main>
        <img id="cover" alt="">
        <section id="song" aria-live="polite">
            <div id="station" class="empty"><img alt=""><span id="stationName"></span></div>
            <p id="title"></p>
            <p id="artist"></p>
            <p id="release"><span id="album"></span><span id="year"></span></p>
        </section>
        <div id="captions" class="empty" aria-live="polite"><span id="captionText"></span></div>
    </main>
    <!-- The page's scripts: after the elements they draw in, as the framework above; the logo measure first. -->
    <script src="logo-tone.js"></script>
    <script src="theme.js"></script>
    <script src="layout-report.js"></script>
    <script src="receiver.js"></script>
</body>
</html>
