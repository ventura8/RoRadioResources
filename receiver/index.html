<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RoRadio</title>
    <!--
        The RoRadio Cast receiver (2.4.5). A Chromecast, a TV or a smart display loads this page when the app casts a
        station: Google's media player plays the stream, and this page shows the song - cover, title, artist, album,
        year - and the live captions, each on its own line. The app sends a song change as a QUEUE_UPDATE of the item
        playing (Google's own receiver ignores those); the interceptor below applies it here, and to the senders'
        notifications through setMediaInformation. The caption comes as the item's customData (a string).
        Layout rules (Cast design guidelines): everything inside a 5 % safe area, text at least 24 px at 720p, white on
        a dark scrim over the blurred cover, a fixed grid so no element can grow into another, long text clamped with an
        ellipsis. Audio-only devices draw nothing and play the audio.
    -->
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
        :root {
            color-scheme: dark;
            --safe: 5vmin;
            --gap: clamp(16px, 3.5vmin, 48px);
            --text: #ffffff;
            --muted: rgb(255 255 255 / 78%);
            --scrim: rgb(8 10 14 / 72%);
            --accent: #ff6a3d;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #08090c;
            color: var(--text);
            font-family: "Google Sans", Roboto, "Segoe UI", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Google's player plays the stream; this page draws its own screen. */
        cast-media-player {
            display: none;
        }

        #backdrop {
            position: fixed;
            inset: -10%;
            background-position: center;
            background-size: cover;
            filter: blur(60px) saturate(1.3);
            transform: scale(1.1);
            opacity: 0;
            transition: opacity 600ms ease;
        }

        #backdrop.shown {
            opacity: 1;
        }

        #scrim {
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, var(--scrim), rgb(8 10 14 / 88%));
        }

        main {
            position: fixed;
            inset: var(--safe);
            display: grid;
            grid-template-columns: minmax(0, auto) minmax(0, 1fr);
            grid-template-rows: minmax(0, 1fr) auto;
            grid-template-areas:
                "cover song"
                "captions captions";
            column-gap: var(--gap);
            row-gap: var(--gap);
            align-items: center;
        }

        #cover {
            grid-area: cover;
            width: min(42vmin, 44vw);
            aspect-ratio: 1;
            border-radius: clamp(12px, 2vmin, 28px);
            object-fit: cover;
            background: rgb(255 255 255 / 8%);
            box-shadow: 0 2vmin 6vmin rgb(0 0 0 / 55%);
        }

        #song {
            grid-area: song;
            min-width: 0;
            display: grid;
            row-gap: clamp(6px, 1.2vmin, 16px);
        }

        #song > * {
            margin: 0;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #title {
            font-size: clamp(28px, 6.2vmin, 88px);
            font-weight: 700;
            line-height: 1.15;
            white-space: normal;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
        }

        #artist {
            font-size: clamp(24px, 4.4vmin, 60px);
            font-weight: 500;
            line-height: 1.2;
        }

        #album,
        #year {
            font-size: clamp(24px, 3.4vmin, 44px);
            color: var(--muted);
            line-height: 1.25;
        }

        #station {
            margin-top: clamp(8px, 2vmin, 28px);
            display: flex;
            align-items: center;
            column-gap: clamp(8px, 1.4vmin, 18px);
            min-width: 0;
        }

        #station img {
            width: clamp(36px, 6vmin, 72px);
            height: clamp(36px, 6vmin, 72px);
            flex: none;
            border-radius: 25%;
            object-fit: contain;
            background: #ffffff;
        }

        #captions {
            grid-area: captions;
            justify-self: center;
            max-width: min(100%, 72ch);
            margin: 0;
            padding: clamp(10px, 1.6vmin, 22px) clamp(16px, 2.6vmin, 36px);
            border-radius: clamp(10px, 1.6vmin, 20px);
            background: rgb(0 0 0 / 70%);
            font-size: clamp(24px, 3.8vmin, 52px);
            line-height: 1.3;
            text-align: center;
        }

        /* Clamped inside the band: the band's padding never shows a cut third line. */
        #captionText {
            overflow: hidden;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
        }

        #captions.empty,
        #album:empty,
        #year:empty,
        #station.empty {
            display: none;
        }

        /* Before a station is cast, and between plays. */
        #idle {
            position: fixed;
            inset: 0;
            display: grid;
            place-content: center;
            text-align: center;
            row-gap: 2vmin;
        }

        #idle h1 {
            margin: 0;
            font-size: clamp(40px, 9vmin, 120px);
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        #idle h1 span {
            color: var(--accent);
        }

        #idle p {
            margin: 0;
            font-size: clamp(24px, 3.4vmin, 44px);
            color: var(--muted);
        }

        body.playing #idle,
        body:not(.playing) main {
            display: none;
        }

        /* A tall screen (a display turned upright): the cover above the song. */
        @media (aspect-ratio < 1) {
            main {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: auto minmax(0, 1fr) auto;
                grid-template-areas:
                    "cover"
                    "song"
                    "captions";
                justify-items: center;
                text-align: center;
            }

            #cover {
                width: min(60vw, 40vh);
            }

            #station {
                justify-content: center;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #backdrop {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <cast-media-player></cast-media-player>
    <div id="backdrop" aria-hidden="true"></div>
    <div id="scrim" aria-hidden="true"></div>
    <div id="idle">
        <h1>Ro<span>Radio</span></h1>
        <p>Ready to play</p>
    </div>
    <main>
        <img id="cover" alt="">
        <section id="song" aria-live="polite">
            <h1 id="title"></h1>
            <h2 id="artist"></h2>
            <p id="album"></p>
            <p id="year"></p>
            <div id="station" class="empty"><img alt=""></div>
        </section>
        <div id="captions" class="empty" aria-live="polite"><span id="captionText"></span></div>
    </main>
    <script>
        'use strict';

        const context = cast.framework.CastReceiverContext.getInstance();
        const player = context.getPlayerManager();
        const byId = (id) => document.getElementById(id);

        /** The year of a release date ("2015" or "2015-03-01"); empty when there is none. */
        function yearOf(date) {
            return typeof date === 'string' ? date.slice(0, 4) : '';
        }

        /** Sets an image's source once it has loaded, so a broken url never shows a broken picture. */
        function showImage(image, url, onShown) {
            if (!url) {
                image.removeAttribute('src');
                return;
            }

            const probe = new Image();
            probe.onload = () => {
                image.src = url;
                if (onShown) {
                    onShown(url);
                }
            };
            probe.src = url;
        }

        /** Draws the song of `media`: its metadata, its pictures (the cover, then the station's logo), its caption. */
        function show(media) {
            const metadata = (media && media.metadata) || {};
            byId('title').textContent = metadata.title || metadata.songName || '';
            byId('artist').textContent = metadata.artist || metadata.subtitle || '';
            byId('album').textContent = metadata.albumName || '';
            byId('year').textContent = yearOf(metadata.releaseDate);
            const caption = typeof media.customData === 'string' ? media.customData : '';
            byId('captionText').textContent = caption;
            byId('captions').classList.toggle('empty', !caption);

            const images = metadata.images || [];
            const cover = images[0] && images[0].url;
            const logo = images[1] && images[1].url;
            showImage(byId('cover'), cover, (url) => {
                byId('backdrop').style.backgroundImage = `url("${url}")`;
                byId('backdrop').classList.add('shown');
            });
            const station = byId('station');
            station.classList.toggle('empty', !logo);
            showImage(station.querySelector('img'), logo);
            document.body.classList.add('playing');
        }

        /** A LOAD: the station starts; its song is shown with it. */
        player.setMessageInterceptor(cast.framework.messages.MessageType.LOAD, (request) => {
            if (request.media) {
                show(request.media);
            }

            return request;
        });

        /**
         * A song change or a caption (the app's QUEUE_UPDATE of the item playing): shown here, and given to the
         * player's media information so the senders' notifications and the Google Home app show the new song too.
         */
        player.setMessageInterceptor(cast.framework.messages.MessageType.QUEUE_UPDATE, (request) => {
            const media = request.items && request.items[0] && request.items[0].media;
            if (media && media.metadata) {
                show(media);
                const playing = player.getMediaInformation();
                if (playing) {
                    playing.metadata = Object.assign(playing.metadata || {}, media.metadata);
                    playing.customData = media.customData;
                    player.setMediaInformation(playing, true);
                }
            }

            return request;
        });

        player.addEventListener(cast.framework.events.EventType.MEDIA_FINISHED, () => document.body.classList.remove('playing'));

        const options = new cast.framework.CastReceiverOptions();
        // A radio station plays until it is stopped; the receiver stays while it is idle between two stations.
        options.maxInactivity = 3600;
        context.start(options);
    </script>
</body>
</html>
