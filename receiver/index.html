<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--
        Content Security Policy: scripts only from the Cast framework on www.gstatic.com (and the Shaka player it loads,
        protocol-relative, from ajax.googleapis.com: https on a device, as the page is https) and this page's own inline
        script, by its hash (tests/receiver.test.js recomputes it, so a script change without a new hash fails CI); no
        eval, no plugins, no forms, no base. Pictures and streams are the station's own, on any http(s) host.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-/FgAlM5ixk1wc8NLGYtuh4gyBm9UNOSwKWuqR21pdw4=' https://www.gstatic.com ajax.googleapis.com; style-src 'unsafe-inline' https://www.gstatic.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com https://www.gstatic.com data:; img-src https: http: data: blob:; media-src https: http: data: blob:; connect-src https: http: wss: ws://localhost:8008; worker-src blob: https://www.gstatic.com; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>RoRadio</title>
    <!--
        The RoRadio Cast receiver (2.4.5). A Chromecast, a TV or a smart display loads this page when the app casts a
        station: Google's media player plays the stream, and this page shows the song - cover, title, artist, album,
        year - and the live captions, each on its own line. The app sends a song change as a QUEUE_UPDATE of the item
        playing (Google's own receiver ignores those); the interceptor below applies it here, and to the senders'
        notifications through setMediaInformation. The item's customData is JSON text, {"caption", "previous",
        "next"} (a bare string from older app builds is the caption alone).
        Previous / next (2.4.5): while the station has others in its group the page declares QUEUE_PREV / QUEUE_NEXT,
        so a smart display, Google TV and the Google Home app show those buttons (none when the station is alone in its
        group, as in the app). A press is not played here: the page broadcasts a media status whose customData is
        {"step": "previous"|"next", "stepId": n}, and the app steps through the group exactly as its own buttons do,
        then loads the new station here.
        Touch displays (2.4.5): the page plays through its own audio element and declares uiConfig.touchScreenOptimizedApp,
        so a Pixel Tablet or a Nest Hub shows this page, not Google's default audio UI, and the page's own previous /
        pause / next buttons are there to tap.
        The cover fills the safe area's height on the left (the station's logo takes its place when the song has no
        cover), the station's logo heads the song's column, and the text is sized for a room away from the TV.
        Layout rules (Cast design guidelines): everything inside a 5 % safe area, text at least 24 px at 720p, white on
        a dark scrim over the blurred cover, a fixed grid so no element can grow into another, long text clamped with an
        ellipsis. Audio-only devices draw nothing and play the audio.
    -->
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
        :root {
            color-scheme: dark;
            --safe-x: 5vw;
            --safe-y: 5vh;
            --gap: clamp(16px, 3.5vmin, 48px);
            --text: #ffffff;
            --muted: rgb(255 255 255 / 78%);
            --scrim: rgb(8 10 14 / 72%);
            --accent: #ff6a3d;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #08090c;
            color: var(--text);
            font-family: "Google Sans", Roboto, "Segoe UI", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /*
         * The page's own audio element plays the stream (player.setMediaElement): with Google's cast-media-player, a
         * touch display (Pixel Tablet, Nest Hub) drew its default audio UI over this page.
         */
        #media {
            display: none;
        }

        #backdrop {
            position: fixed;
            inset: -10%;
            background-position: center;
            background-size: cover;
            filter: blur(60px) saturate(1.3);
            transform: scale(1.1);
            opacity: 0;
            transition: opacity 600ms ease;
        }

        #backdrop.shown {
            opacity: 1;
        }

        #scrim {
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, var(--scrim), rgb(8 10 14 / 88%));
        }

        main {
            position: fixed;
            inset: var(--safe-y) var(--safe-x);
            display: grid;
            grid-template-columns: minmax(0, auto) minmax(0, 1fr);
            grid-template-rows: minmax(0, 1fr) auto;
            grid-template-areas:
                "cover song"
                "captions captions";
            column-gap: var(--gap);
            row-gap: var(--gap);
            /* The cover and the song from the same top: the station's logo level with the cover's top edge. */
            align-items: start;
        }

        /* No caption band: no gap for it either, or a full-height cover ran past the safe area (2560 x 1080). */
        body:not(.captioned) main {
            row-gap: 0;
        }

        /*
         * The cover is the screen's picture: the safe area's whole height beside the song, less the captions' band while
         * one shows (body.captioned), and never more than half the width, so the song keeps its column.
         */
        body {
            --cover: min(90vh, 48vw);
        }

        /* 90 % less a two-line caption band (2 x 6 vmin + padding) and the gap: the cover never reaches it. */
        body.captioned {
            --cover: min(70vh, 48vw);
        }

        #cover {
            grid-area: cover;
            width: var(--cover);
            aspect-ratio: 1;
            border-radius: clamp(12px, 2vmin, 28px);
            object-fit: cover;
            background: rgb(255 255 255 / 8%);
            box-shadow: 0 2vmin 6vmin rgb(0 0 0 / 55%);
            /* No animation of its size: shrinking as a caption band appeared, it covered the band for 300 ms. */
        }

        /* No cover for the song: the station's own logo in its place, whole, on white. */
        #cover.logo {
            object-fit: contain;
            padding: 4vmin;
            background: #ffffff;
        }

        /*
         * Filled from the top, as tall as its text needs up to the whole row: on a 4:3 or near-square screen the cover
         * (half the width) is shorter than the logo and a two-line title, and the song goes on below its bottom edge.
         */
        #song {
            grid-area: song;
            min-width: 0;
            max-height: 100%;
            overflow: hidden;
            display: grid;
            align-content: start;
            row-gap: clamp(8px, 1.6vmin, 22px);
        }

        #song > * {
            margin: 0;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #title {
            font-size: clamp(32px, 11vmin, 160px);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.01em;
            white-space: normal;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
        }

        #artist {
            font-size: clamp(26px, 7vmin, 100px);
            font-weight: 500;
            line-height: 1.2;
        }

        /* The album and its year on one line: "Deliria · 2015". */
        #release {
            font-size: clamp(24px, 5.5vmin, 80px);
            color: var(--muted);
            line-height: 1.25;
        }

        #album:not(:empty) + #year:not(:empty)::before {
            content: " \00b7  ";
        }

        #station {
            display: flex;
            align-items: center;
            min-width: 0;
            margin-bottom: clamp(4px, 1vmin, 14px);
        }

        #station img {
            /* As big as the column takes with a two-line title and a two-line caption (owner: the station's icon big too). */
            width: clamp(72px, 22vmin, 300px);
            height: clamp(72px, 22vmin, 300px);
            flex: none;
            border-radius: 22%;
            object-fit: contain;
            /* In vmin: a padding in % is a share of the column's width, which left no room for the logo. */
            padding: clamp(4px, 1vmin, 14px);
            background: #ffffff;
            box-shadow: 0 1vmin 3vmin rgb(0 0 0 / 45%);
        }

        /* The station's name beside its logo: never a placeholder, nothing when the app sends none. */
        #stationName {
            min-width: 0;
            margin-left: clamp(10px, 2vmin, 28px);
            overflow: hidden;
            color: var(--muted);
            font-size: clamp(22px, 4vmin, 56px);
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #station img:not([src]) {
            display: none;
        }

        #captions {
            grid-area: captions;
            justify-self: center;
            max-width: 100%;
            margin: 0;
            padding: clamp(10px, 1.6vmin, 22px) clamp(18px, 3vmin, 42px);
            border-radius: clamp(10px, 1.6vmin, 20px);
            background: rgb(0 0 0 / 70%);
            font-size: clamp(26px, 4.6vmin, 64px);
            line-height: 1.3;
            text-align: center;
        }

        /* Clamped inside the band: the band's padding never shows a cut third line. */
        #captionText {
            overflow: hidden;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
        }

        #captions.empty,
        /* By class, set by show(): a selector a receiver's browser does not know (:has) would drop the whole rule. */
        #release.empty,
        #station.empty {
            display: none;
        }

        /* Before a station is cast, and between plays. */
        #idle {
            position: fixed;
            inset: 0;
            display: grid;
            place-content: center;
            justify-items: center;
            text-align: center;
            row-gap: 2.4vmin;
            background: radial-gradient(circle at 50% 42%, rgb(255 106 61 / 18%), transparent 55%), #08090c;
        }

        /* The app's own icon on a soft tile (1920 x 1080: 216 px; 2560 x 1600: 320 px). */
        #appIcon {
            width: clamp(120px, 20vmin, 320px);
            height: clamp(120px, 20vmin, 320px);
            padding: clamp(16px, 2.6vmin, 40px);
            box-sizing: border-box;
            border-radius: 22%;
            background: rgb(255 255 255 / 8%);
            box-shadow: 0 2vmin 6vmin rgb(0 0 0 / 50%);
            object-fit: contain;
        }

        #idle #hint {
            font-size: clamp(24px, 2.4vmin, 32px);
            color: rgb(255 255 255 / 60%);
        }

        /* Previous / pause / next to tap, on a touch display only (a TV has its remote and the device's own controls). */
        #controls {
            display: none;
            column-gap: clamp(24px, 5vmin, 72px);
            margin-top: clamp(16px, 4vmin, 56px);
        }

        body.touch #controls {
            display: flex;
        }

        #controls button {
            width: clamp(64px, 11vmin, 140px);
            height: clamp(64px, 11vmin, 140px);
            border: 0;
            border-radius: 50%;
            background: rgb(255 255 255 / 14%);
            color: var(--text);
            font-size: clamp(28px, 5vmin, 64px);
            touch-action: manipulation;
        }

        #controls button:active {
            background: rgb(255 255 255 / 30%);
        }

        #controls #playPause {
            background: var(--accent);
        }

        #controls button.hidden {
            visibility: hidden;
        }

        #idle h1 {
            margin: 0;
            font-size: clamp(40px, 9vmin, 120px);
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        #idle h1 span {
            color: var(--accent);
        }

        #idle p {
            margin: 0;
            font-size: clamp(24px, 3.4vmin, 44px);
            color: var(--muted);
        }

        body.playing #idle,
        body:not(.playing) main {
            display: none;
        }

        /* A tall screen (a display turned upright): the cover above the song. */
        @media (aspect-ratio < 1) {
            main {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: auto minmax(0, 1fr) auto;
                grid-template-areas:
                    "cover"
                    "song"
                    "captions";
                justify-items: center;
                text-align: center;
            }

            /* The cover, the logo, a two-line title and a two-line caption, stacked within the height (800 x 1280). */
            body,
            body.captioned {
                --cover: min(84vw, 36vh);
            }

            #station img {
                width: clamp(56px, 12vmin, 160px);
                height: clamp(56px, 12vmin, 160px);
            }

            #station,
            #controls {
                justify-content: center;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #backdrop {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <audio id="media"></audio>
    <div id="backdrop" aria-hidden="true"></div>
    <div id="scrim" aria-hidden="true"></div>
    <div id="idle">
        <img id="appIcon" src="icon.png" alt="">
        <h1>Ro<span>Radio</span></h1>
        <p id="status">Ready to play</p>
        <p id="hint">Romanian radio, live</p>
    </div>
    <main>
        <img id="cover" alt="">
        <section id="song" aria-live="polite">
            <div id="station" class="empty"><img alt=""><span id="stationName"></span></div>
            <h1 id="title"></h1>
            <h2 id="artist"></h2>
            <p id="release"><span id="album"></span><span id="year"></span></p>
            <nav id="controls" aria-label="Playback">
                <button id="previous" type="button" class="hidden" aria-label="Previous station">&#x23EE;</button>
                <button id="playPause" type="button" aria-label="Pause">&#x23F8;</button>
                <button id="next" type="button" class="hidden" aria-label="Next station">&#x23ED;</button>
            </nav>
        </section>
        <div id="captions" class="empty" aria-live="polite"><span id="captionText"></span></div>
    </main>
    <script>
        'use strict';

        const context = cast.framework.CastReceiverContext.getInstance();
        const player = context.getPlayerManager();
        const byId = (id) => document.getElementById(id);

        /** The year of a release date ("2015" or "2015-03-01"); empty when there is none. */
        function yearOf(date) {
            return typeof date === 'string' ? date.slice(0, 4) : '';
        }

        /**
         * An image url from the app's metadata, only when it is http(s), normalized (quotes, spaces and newlines
         * percent-encoded) so it is safe inside CSS url("..."); anything else (javascript:, data:, junk) is none.
         */
        function imageUrl(url) {
            if (typeof url !== 'string') {
                return '';
            }

            try {
                const parsed = new URL(url);
                return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '';
            } catch (e) {
                return '';
            }
        }

        /**
         * Sets an image's source once it has loaded, so a broken url never shows a broken picture. Only the newest
         * request for an image applies: a slow old cover never replaces a newer one, nor brings back a removed one.
         */
        function showImage(image, url, onShown) {
            const request = (image.dataset.request = String(Number(image.dataset.request || 0) + 1));
            if (!url) {
                image.removeAttribute('src');
                return;
            }

            const probe = new Image();
            probe.onload = () => {
                if (image.dataset.request !== request) {
                    return;
                }

                image.src = url;
                if (onShown) {
                    onShown(url);
                }
            };
            probe.onerror = () => {
                // A picture that does not load: none, rather than the last song's.
                if (image.dataset.request !== request) {
                    return;
                }

                image.removeAttribute('src');
                if (onShown) {
                    onShown(null);
                }
            };
            probe.src = url;
        }

        /**
         * The app's data for this item: {"caption", "previous", "next"} as JSON text; a plain string (older app builds)
         * is the caption alone, with no steps.
         */
        function appData(customData) {
            const none = { caption: '', previous: false, next: false, station: '', logo: '' };
            const text = (value) => (typeof value === 'string' ? value : '');
            if (typeof customData !== 'string') {
                return none;
            }

            if (customData.startsWith('{')) {
                try {
                    const data = JSON.parse(customData);
                    return {
                        caption: text(data.caption),
                        previous: data.previous === true,
                        next: data.next === true,
                        station: text(data.station),
                        logo: text(data.logo),
                    };
                } catch (e) {
                    // Not the app's JSON: a caption that starts with a brace.
                }
            }

            return { ...none, caption: customData };
        }

        const Command = cast.framework.messages.Command;
        const stepCommands = Command.QUEUE_PREV | Command.QUEUE_NEXT;
        let baseCommands = null;

        /**
         * Previous / next as the app offers them: declared only for a step the station has, so the device's own media
         * controls (smart display, Google TV, Google Home) show exactly those buttons.
         */
        function showSteps(previous, next) {
            if (baseCommands === null) {
                baseCommands = player.getSupportedMediaCommands() & ~stepCommands;
            }

            const commands = baseCommands | (previous ? Command.QUEUE_PREV : 0) | (next ? Command.QUEUE_NEXT : 0);
            player.setSupportedMediaCommands(commands, true);
            // The page's own buttons on a touch display: exactly the steps the station has.
            byId('previous').classList.toggle('hidden', !previous);
            byId('next').classList.toggle('hidden', !next);
        }

        /** A previous / next press, for the app: a media status whose customData names it, numbered upwards. */
        let lastStepId = 0;
        function step(name) {
            lastStepId = Math.max(Date.now(), lastStepId + 1);
            player.broadcastStatus(false, undefined, { step: name, stepId: lastStepId });
        }

        /** Draws the song of `media`: its metadata, its pictures (the cover, then the station's logo), its caption. */
        function show(media) {
            const metadata = (media && media.metadata) || {};
            byId('title').textContent = metadata.title || metadata.songName || '';
            byId('artist').textContent = metadata.artist || metadata.subtitle || '';
            byId('album').textContent = metadata.albumName || '';
            byId('year').textContent = yearOf(metadata.releaseDate);
            byId('release').classList.toggle('empty', !metadata.albumName && !yearOf(metadata.releaseDate));
            const data = appData(media && media.customData);
            const caption = data.caption;
            showSteps(data.previous, data.next);
            byId('captionText').textContent = caption;
            byId('captions').classList.toggle('empty', !caption);
            document.body.classList.toggle('captioned', Boolean(caption));

            // The app sends [cover, station logo] when the song has a cover, and [station logo] alone when it has none:
            // the logo then takes the cover's place, whole, and is not shown twice. Since 2.4.5 the customData also
            // names the station and its logo, so the logo shows beside the cover whatever the images hold.
            const images = metadata.images || [];
            const cover = imageUrl(images[0] && images[0].url);
            const dataLogo = imageUrl(data.logo);
            const logo = imageUrl(images[1] && images[1].url) || (dataLogo !== cover ? dataLogo : '');
            byId('stationName').textContent = data.station;
            byId('cover').classList.toggle('logo', Boolean(cover) && !logo);
            const backdrop = byId('backdrop');
            const showBackdrop = (url) => {
                // No picture for this song (none sent, or it did not load): no backdrop from the last one.
                backdrop.style.backgroundImage = url ? `url("${url}")` : '';
                backdrop.classList.toggle('shown', Boolean(url));
            };
            if (!cover) {
                showBackdrop(null);
            }

            showImage(byId('cover'), cover, showBackdrop);
            const station = byId('station');
            station.classList.toggle('empty', !logo && !data.station);
            showImage(station.querySelector('img'), logo);
            document.body.classList.add('playing');
        }

        /** A LOAD: the station starts; its song is shown with it. */
        player.setMessageInterceptor(cast.framework.messages.MessageType.LOAD, (request) => {
            if (request.media) {
                show(request.media);
            }

            return request;
        });

        /**
         * A song change or a caption (the app's QUEUE_UPDATE of the item playing): shown here, and given to the
         * player's media information so the senders' notifications and the Google Home app show the new song too.
         */
        player.setMessageInterceptor(cast.framework.messages.MessageType.QUEUE_UPDATE, (request) => {
            // A sender's previous / next (the Google Home app, an Android notification) is a jump in the queue: the app
            // steps instead, and loads the station it reaches.
            if (request.jump === 1 || request.jump === -1) {
                step(request.jump === 1 ? 'next' : 'previous');
                return null;
            }

            const media = request.items && request.items[0] && request.items[0].media;
            if (media && media.metadata) {
                show(media);
                const playing = player.getMediaInformation();
                if (playing) {
                    // The new song's metadata whole: an album or a year the new song has none of must not stay.
                    playing.metadata = media.metadata;
                    playing.customData = media.customData;
                    player.setMediaInformation(playing, true);
                }
            }

            return request;
        });

        /*
         * The device's own previous / next (a smart display's touch controls, Google TV's remote, the Assistant) reach
         * the page as a QUEUE_UPDATE jump, above. No interceptor for QUEUE_NEXT / QUEUE_PREV: the framework names them in
         * MessageType but throws "Unknown message type" for an interceptor, which stopped this script before
         * context.start(), so the page never answered the launch and the app fell back to the Default Media Receiver
         * after 30 s (Pixel Tablet, 2026-11-14).
         */

        player.addEventListener(cast.framework.events.EventType.MEDIA_FINISHED, () => document.body.classList.remove('playing'));

        /** The pause button shows what a tap does: pause while it plays, play while it is paused. */
        function showPaused(paused) {
            const button = byId('playPause');
            button.textContent = paused ? '▶' : '⏸';
            button.setAttribute('aria-label', paused ? 'Play' : 'Pause');
        }

        player.addEventListener(cast.framework.events.EventType.PAUSE, () => showPaused(true));
        player.addEventListener(cast.framework.events.EventType.PLAYING, () => showPaused(false));

        // A touch display's taps: previous / next step through the group in the app, as the device's own buttons do.
        byId('previous').addEventListener('click', () => step('previous'));
        byId('next').addEventListener('click', () => step('next'));
        byId('playPause').addEventListener('click', () => {
            if (player.getPlayerState() === cast.framework.messages.PlayerState.PAUSED) {
                player.play();
            } else {
                player.pause();
            }
        });

        /** Whether this device takes touch (Pixel Tablet, Nest Hub): its buttons show on the page then. */
        function isTouch() {
            try {
                const capabilities = context.getDeviceCapabilities() || {};
                if (capabilities[cast.framework.system.DeviceCapabilities.TOUCH_INPUT_SUPPORTED]) {
                    return true;
                }
            } catch (e) {
                // Not ready yet, or off a device: the pointer decides.
            }

            return typeof window.matchMedia === 'function' && window.matchMedia('(pointer: coarse)').matches;
        }

        const markTouch = () => document.body.classList.toggle('touch', isTouch());
        context.addEventListener(cast.framework.system.EventType.READY, markTouch);
        markTouch();

        // The page's own media element: with Google's cast-media-player a touch display drew its default audio UI (the
        // station's name twice, no logo) over this page (Pixel Tablet, 2026-11-14).
        player.setMediaElement(byId('media'));

        const options = new cast.framework.CastReceiverOptions();
        // A radio station plays until it is stopped; the receiver stays while it is idle between two stations.
        options.maxInactivity = 3600;
        // This page is the touch UI (Cast's smart display guide): no default controls or opaque scrim over it.
        options.uiConfig = new cast.framework.ui.UiConfig();
        options.uiConfig.touchScreenOptimizedApp = true;
        context.start(options);
    </script>
</body>
</html>
