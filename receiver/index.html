<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RoRadio</title>
    <!--
        The RoRadio Cast receiver (2.4.5). A Chromecast, a TV or a smart display loads this page when the app casts a
        station: Google's media player plays the stream, and this page shows the song - cover, title, artist, album,
        year - and the live captions, each on its own line. The app sends a song change as a QUEUE_UPDATE of the item
        playing (Google's own receiver ignores those); the interceptor below applies it here, and to the senders'
        notifications through setMediaInformation. The caption comes as the item's customData (a string).
        The cover fills the safe area's height on the left (the station's logo takes its place when the song has no
        cover), the station's logo heads the song's column, and the text is sized for a room away from the TV.
        Layout rules (Cast design guidelines): everything inside a 5 % safe area, text at least 24 px at 720p, white on
        a dark scrim over the blurred cover, a fixed grid so no element can grow into another, long text clamped with an
        ellipsis. Audio-only devices draw nothing and play the audio.
    -->
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
        :root {
            color-scheme: dark;
            --safe-x: 5vw;
            --safe-y: 5vh;
            --gap: clamp(16px, 3.5vmin, 48px);
            --text: #ffffff;
            --muted: rgb(255 255 255 / 78%);
            --scrim: rgb(8 10 14 / 72%);
            --accent: #ff6a3d;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #08090c;
            color: var(--text);
            font-family: "Google Sans", Roboto, "Segoe UI", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Google's player plays the stream; this page draws its own screen. */
        cast-media-player {
            display: none;
        }

        #backdrop {
            position: fixed;
            inset: -10%;
            background-position: center;
            background-size: cover;
            filter: blur(60px) saturate(1.3);
            transform: scale(1.1);
            opacity: 0;
            transition: opacity 600ms ease;
        }

        #backdrop.shown {
            opacity: 1;
        }

        #scrim {
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, var(--scrim), rgb(8 10 14 / 88%));
        }

        main {
            position: fixed;
            inset: var(--safe-y) var(--safe-x);
            display: grid;
            grid-template-columns: minmax(0, auto) minmax(0, 1fr);
            grid-template-rows: minmax(0, 1fr) auto;
            grid-template-areas:
                "cover song"
                "captions captions";
            column-gap: var(--gap);
            row-gap: var(--gap);
            /* The cover and the song from the same top: the station's logo level with the cover's top edge. */
            align-items: start;
        }

        /* No caption band: no gap for it either, or a full-height cover ran past the safe area (2560 x 1080). */
        body:not(.captioned) main {
            row-gap: 0;
        }

        /*
         * The cover is the screen's picture: the safe area's whole height beside the song, less the captions' band while
         * one shows (body.captioned), and never more than half the width, so the song keeps its column.
         */
        body {
            --cover: min(90vh, 48vw);
        }

        /* 90 % less a two-line caption band (2 x 6 vmin + padding) and the gap: the cover never reaches it. */
        body.captioned {
            --cover: min(70vh, 48vw);
        }

        #cover {
            grid-area: cover;
            width: var(--cover);
            aspect-ratio: 1;
            border-radius: clamp(12px, 2vmin, 28px);
            object-fit: cover;
            background: rgb(255 255 255 / 8%);
            box-shadow: 0 2vmin 6vmin rgb(0 0 0 / 55%);
            /* No animation of its size: shrinking as a caption band appeared, it covered the band for 300 ms. */
        }

        /* No cover for the song: the station's own logo in its place, whole, on white. */
        #cover.logo {
            object-fit: contain;
            padding: 4vmin;
            background: #ffffff;
        }

        /*
         * Filled from the top, as tall as its text needs up to the whole row: on a 4:3 or near-square screen the cover
         * (half the width) is shorter than the logo and a two-line title, and the song goes on below its bottom edge.
         */
        #song {
            grid-area: song;
            min-width: 0;
            max-height: 100%;
            overflow: hidden;
            display: grid;
            align-content: start;
            row-gap: clamp(8px, 1.6vmin, 22px);
        }

        #song > * {
            margin: 0;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #title {
            font-size: clamp(32px, 11vmin, 160px);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.01em;
            white-space: normal;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
        }

        #artist {
            font-size: clamp(26px, 7vmin, 100px);
            font-weight: 500;
            line-height: 1.2;
        }

        /* The album and its year on one line: "Deliria · 2015". */
        #release {
            font-size: clamp(24px, 5.5vmin, 80px);
            color: var(--muted);
            line-height: 1.25;
        }

        #album:not(:empty) + #year:not(:empty)::before {
            content: " \00b7  ";
        }

        #station {
            display: flex;
            align-items: center;
            min-width: 0;
            margin-bottom: clamp(4px, 1vmin, 14px);
        }

        #station img {
            /* As big as the column takes with a two-line title and a two-line caption (owner: the station's icon big too). */
            width: clamp(72px, 22vmin, 300px);
            height: clamp(72px, 22vmin, 300px);
            flex: none;
            border-radius: 22%;
            object-fit: contain;
            /* In vmin: a padding in % is a share of the column's width, which left no room for the logo. */
            padding: clamp(4px, 1vmin, 14px);
            background: #ffffff;
            box-shadow: 0 1vmin 3vmin rgb(0 0 0 / 45%);
        }

        #captions {
            grid-area: captions;
            justify-self: center;
            max-width: 100%;
            margin: 0;
            padding: clamp(10px, 1.6vmin, 22px) clamp(18px, 3vmin, 42px);
            border-radius: clamp(10px, 1.6vmin, 20px);
            background: rgb(0 0 0 / 70%);
            font-size: clamp(26px, 4.6vmin, 64px);
            line-height: 1.3;
            text-align: center;
        }

        /* Clamped inside the band: the band's padding never shows a cut third line. */
        #captionText {
            overflow: hidden;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
        }

        #captions.empty,
        /* By class, set by show(): a selector a receiver's browser does not know (:has) would drop the whole rule. */
        #release.empty,
        #station.empty {
            display: none;
        }

        /* Before a station is cast, and between plays. */
        #idle {
            position: fixed;
            inset: 0;
            display: grid;
            place-content: center;
            text-align: center;
            row-gap: 2vmin;
        }

        #idle h1 {
            margin: 0;
            font-size: clamp(40px, 9vmin, 120px);
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        #idle h1 span {
            color: var(--accent);
        }

        #idle p {
            margin: 0;
            font-size: clamp(24px, 3.4vmin, 44px);
            color: var(--muted);
        }

        body.playing #idle,
        body:not(.playing) main {
            display: none;
        }

        /* A tall screen (a display turned upright): the cover above the song. */
        @media (aspect-ratio < 1) {
            main {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: auto minmax(0, 1fr) auto;
                grid-template-areas:
                    "cover"
                    "song"
                    "captions";
                justify-items: center;
                text-align: center;
            }

            /* The cover, the logo, a two-line title and a two-line caption, stacked within the height (800 x 1280). */
            body,
            body.captioned {
                --cover: min(84vw, 36vh);
            }

            #station img {
                width: clamp(56px, 12vmin, 160px);
                height: clamp(56px, 12vmin, 160px);
            }

            #station {
                justify-content: center;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #backdrop {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <cast-media-player></cast-media-player>
    <div id="backdrop" aria-hidden="true"></div>
    <div id="scrim" aria-hidden="true"></div>
    <div id="idle">
        <h1>Ro<span>Radio</span></h1>
        <p>Ready to play</p>
    </div>
    <main>
        <img id="cover" alt="">
        <section id="song" aria-live="polite">
            <div id="station" class="empty"><img alt=""></div>
            <h1 id="title"></h1>
            <h2 id="artist"></h2>
            <p id="release"><span id="album"></span><span id="year"></span></p>
        </section>
        <div id="captions" class="empty" aria-live="polite"><span id="captionText"></span></div>
    </main>
    <script>
        'use strict';

        const context = cast.framework.CastReceiverContext.getInstance();
        const player = context.getPlayerManager();
        const byId = (id) => document.getElementById(id);

        /** The year of a release date ("2015" or "2015-03-01"); empty when there is none. */
        function yearOf(date) {
            return typeof date === 'string' ? date.slice(0, 4) : '';
        }

        /**
         * Sets an image's source once it has loaded, so a broken url never shows a broken picture. Only the newest
         * request for an image applies: a slow old cover never replaces a newer one, nor brings back a removed one.
         */
        function showImage(image, url, onShown) {
            const request = (image.dataset.request = String(Number(image.dataset.request || 0) + 1));
            if (!url) {
                image.removeAttribute('src');
                return;
            }

            const probe = new Image();
            probe.onload = () => {
                if (image.dataset.request !== request) {
                    return;
                }

                image.src = url;
                if (onShown) {
                    onShown(url);
                }
            };
            probe.onerror = () => {
                // A picture that does not load: none, rather than the last song's.
                if (image.dataset.request !== request) {
                    return;
                }

                image.removeAttribute('src');
                if (onShown) {
                    onShown(null);
                }
            };
            probe.src = url;
        }

        /** Draws the song of `media`: its metadata, its pictures (the cover, then the station's logo), its caption. */
        function show(media) {
            const metadata = (media && media.metadata) || {};
            byId('title').textContent = metadata.title || metadata.songName || '';
            byId('artist').textContent = metadata.artist || metadata.subtitle || '';
            byId('album').textContent = metadata.albumName || '';
            byId('year').textContent = yearOf(metadata.releaseDate);
            byId('release').classList.toggle('empty', !metadata.albumName && !yearOf(metadata.releaseDate));
            const caption = typeof media.customData === 'string' ? media.customData : '';
            byId('captionText').textContent = caption;
            byId('captions').classList.toggle('empty', !caption);
            document.body.classList.toggle('captioned', Boolean(caption));

            // The app sends [cover, station logo] when the song has a cover, and [station logo] alone when it has none:
            // the logo then takes the cover's place, whole, and is not shown twice.
            const images = metadata.images || [];
            const cover = images[0] && images[0].url;
            const logo = images[1] && images[1].url;
            byId('cover').classList.toggle('logo', Boolean(cover) && !logo);
            const backdrop = byId('backdrop');
            const showBackdrop = (url) => {
                // No picture for this song (none sent, or it did not load): no backdrop from the last one.
                backdrop.style.backgroundImage = url ? `url("${url}")` : '';
                backdrop.classList.toggle('shown', Boolean(url));
            };
            if (!cover) {
                showBackdrop(null);
            }

            showImage(byId('cover'), cover, showBackdrop);
            const station = byId('station');
            station.classList.toggle('empty', !logo);
            showImage(station.querySelector('img'), logo);
            document.body.classList.add('playing');
        }

        /** A LOAD: the station starts; its song is shown with it. */
        player.setMessageInterceptor(cast.framework.messages.MessageType.LOAD, (request) => {
            if (request.media) {
                show(request.media);
            }

            return request;
        });

        /**
         * A song change or a caption (the app's QUEUE_UPDATE of the item playing): shown here, and given to the
         * player's media information so the senders' notifications and the Google Home app show the new song too.
         */
        player.setMessageInterceptor(cast.framework.messages.MessageType.QUEUE_UPDATE, (request) => {
            const media = request.items && request.items[0] && request.items[0].media;
            if (media && media.metadata) {
                show(media);
                const playing = player.getMediaInformation();
                if (playing) {
                    // The new song's metadata whole: an album or a year the new song has none of must not stay.
                    playing.metadata = media.metadata;
                    playing.customData = media.customData;
                    player.setMediaInformation(playing, true);
                }
            }

            return request;
        });

        player.addEventListener(cast.framework.events.EventType.MEDIA_FINISHED, () => document.body.classList.remove('playing'));

        const options = new cast.framework.CastReceiverOptions();
        // A radio station plays until it is stopped; the receiver stays while it is idle between two stations.
        options.maxInactivity = 3600;
        context.start(options);
    </script>
</body>
</html>
